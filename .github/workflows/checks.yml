name: Checks

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.agents/**'
      - '.github/RELEASE_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.agents/**'
      - '.github/RELEASE_TEMPLATE.md'
  # Build portable ZIP runs these checks before it compiles.
  workflow_call:
    outputs:
      package_version:
        value: ${{ jobs.launcher.outputs.package_version }}

permissions:
  contents: read

concurrency:
  # A newer push or pull request update replaces running checks. A manual
  # build runs them inside its own queue, so they are never cancelled here.
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  launcher:
    name: Check launcher and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Determine package version
        id: version
        run: |
          # Only manual main builds can be published, so only they carry the rolling name.
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'value=latest' >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint GitHub Actions workflows
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$RUNNER_TEMP/bin/actionlint"

      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd)" || { gofmt -d cmd; exit 1; }

      - name: Test portable launcher logic and Windows compilation
        run: |
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/startup.test.exe" ./cmd/startup
          GOOS=windows GOARCH=amd64 go vet ./...
          GOBIN="$RUNNER_TEMP/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$RUNNER_TEMP/bin/staticcheck" ./...
          GOOS=windows GOARCH=amd64 "$RUNNER_TEMP/bin/staticcheck" ./...

      - name: Check that every fixture runs in CI
        run: python3 cmake/tests/run_fixtures.py check

      - name: Lint packaging, release and fixture scripts
        run: pipx run --spec ruff==0.17.1 ruff check cmake scripts

      - name: Test distribution assembly and ZIP validation
        shell: pwsh
        run: ./cmake/tests/TestPortableZip.ps1

      - name: Test release publication and build annotation scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test dependency license packaging
        shell: pwsh
        run: ./cmake/tests/TestDependencyLicenses.ps1

      - name: Test historical client packaging
        run: python3 cmake/tests/TestEraClientPackaging.py

      - name: Test client addon packaging
        run: python3 cmake/tests/TestClientAddonPackaging.py

      - name: Test client language merging and gameplay preservation
        run: python3 cmake/tests/TestClientLocales.py

  # The launcher handles Windows file locks and processes, so its tests also
  # run on Windows rather than only compiling for it. Players run the shared
  # addon installer with Windows PowerShell 5.1, which is tested here as well.
  windows:
    name: Check launcher on Windows
    needs: launcher
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test startup launcher
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed.' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher vet failed.' }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test the addon installer with Windows PowerShell
        env:
          POWERSHELL_EXECUTABLE: powershell.exe
        run: |
          python -m unittest scripts/tests/test_package_addon_installer.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Addon installer tests failed.' }

  # Fixtures compile extracted code against doubles, so only a real build shows
  # that every pinned module still compiles and links with the pinned core. A
  # manual build skips it: it compiles the Windows server right after the checks.
  linux_server:
    name: Compile the server on Linux
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_DIR: ${{ github.workspace }}/.linux-server-build
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      # The core's precompiled headers are cacheable only with this sloppiness.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the server's build dependencies
        timeout-minutes: 8
        run: >-
          bash .github/scripts/install-native-dependencies.sh build-essential cmake ccache mold
          libboost-all-dev libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev libncurses-dev zlib1g-dev

      - name: Prepare pinned sources
        run: cmake -P cmake/PrepareModules.cmake

      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: linux-server-${{ github.sha }}
          restore-keys: linux-server-

      # Release objects without debug information keep the build within the
      # runner's disk. The core's defaults build every script and module statically.
      - name: Compile and link worldserver and authserver
        run: |
          cmake -S .module-cache/prepared-core -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold
          cmake --build "$BUILD_DIR" --target worldserver authserver -j"$(nproc)"

      # Pull requests read main's cache; only pushes add one. A failed build
      # still saves it, so the fix compiles only what changed.
      - name: Save the compiler cache
        if: always() && github.event_name == 'push' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: linux-server-${{ github.sha }}

      - name: Report the compiler cache
        if: always()
        run: ccache --show-stats

  # Every shard must pass before a manual build compiles and Publish Latest
  # can select its artifacts.
  gameplay:
    name: Check native gameplay (${{ matrix.shard }})
    needs: launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install native gameplay test dependencies
        timeout-minutes: 8
        run: |
          bash .github/scripts/install-native-dependencies.sh build-essential cmake lua5.1 python3-venv
          python3 -m venv "$RUNNER_TEMP/gameplay-python"
          "$RUNNER_TEMP/gameplay-python/bin/python" -m pip install 'PyYAML==6.0.3'
          "$RUNNER_TEMP/gameplay-python/bin/python" -c 'import yaml; assert yaml.__version__ == "6.0.3"'
          lua5.1 -e 'assert(_VERSION == "Lua 5.1")'
          echo "$RUNNER_TEMP/gameplay-python/bin" >> "$GITHUB_PATH"

      - name: Prepare pinned sources
        run: cmake -P cmake/PrepareModules.cmake

      - name: Check gameplay rules against pinned sources
        run: python3 cmake/tests/run_fixtures.py gameplay --shard-index ${{ matrix.shard }} --shard-count 6

  era_client:
    name: Build and verify historical client patch
    needs: launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.launcher.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read the locked client locale source
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_ENV"
          import json
          source = json.load(open('versions.lock.json'))['clientPatch']['localizations']['deDE']
          repository = source['url'].removeprefix('https://github.com/').removesuffix('.git')
          print(f"LOCALE_REVISION={source['revision']}")
          print(f"LOCALE_RAW_URL=https://raw.githubusercontent.com/{repository}/{source['revision']}")
          PYTHON

      - name: Install native client patch tools
        timeout-minutes: 8
        run: |
          bash .github/scripts/install-native-dependencies.sh build-essential cmake p7zip-full python3-venv lua5.1
          python3 -m venv "$RUNNER_TEMP/era-client-python"
          "$RUNNER_TEMP/era-client-python/bin/python" -m pip install 'PyYAML==6.0.3' 'pytest==8.3.5'
          echo "$RUNNER_TEMP/era-client-python/bin" >> "$GITHUB_PATH"

      - name: Prepare locked server and addon sources
        run: |
          cmake -P cmake/PrepareModules.cmake

      - name: Test historical German text and addon behavior
        run: |
          cd .module-cache/prepared-core/modules/mod-era-talents
          python3 tools/test_era_locales.py
          # A missing fixture leaves the pattern unexpanded, so lua5.1 fails.
          for fixture in client-addon/EraTalents/test_*.lua; do lua5.1 "$fixture"; done

      - name: Test MultiBot inventory money display
        run: python3 cmake/tests/TestMultiBotInventoryMoney.py

      - name: Test MultiBot options initialization
        run: python3 cmake/tests/TestMultiBotOptions.py

      - name: Test Questie Playerbots native comms integration
        run: python3 cmake/tests/TestQuestiePlayerbots.py

      - name: Build merged IP and historical talent client ZIP
        run: cmake "-DPACKAGE_VERSION=$PACKAGE_VERSION" -P cmake/PackageEraClient.cmake

      # The generators copy real records of the pinned English client Spell.dbc.
      - name: Test the historical talent data generators
        env:
          ERA_BASE_SPELL_DBC: ${{ github.workspace }}/.module-cache/client-locales/${{ env.LOCALE_REVISION }}/deDE/Spell.enUS.dbc
        run: |
          test -f "$ERA_BASE_SPELL_DBC"
          cd .module-cache/prepared-core/modules/mod-era-talents
          python3 -m pytest -q -p no:cacheprovider tools --ignore=tools/test_era_locales.py

      - name: Test historical spell groups against native stacking rules
        run: python3 cmake/tests/TestEraSpellGroups.py

      - name: Check each class trainer lesson's introducing expansion
        run: |
          set -euo pipefail
          revision() {
            python3 -c "import json, sys; print(next(source['revision'] for source in json.load(open('versions.lock.json'))['historicalClassData']['sources'] if source['name'] == sys.argv[1]))" "$1"
          }
          dumps="$RUNNER_TEMP/cmangos"
          mkdir -p "$dumps"
          curl --fail --location --retry 3 --output "$dumps/classic-db.sql.gz" \
            "https://raw.githubusercontent.com/cmangos/classic-db/$(revision cmangos-classic-db)/Full_DB/ClassicDB_1_12_1_z2815.sql.gz"
          curl --fail --location --retry 3 --output "$dumps/tbc-db.sql.gz" \
            "https://raw.githubusercontent.com/cmangos/tbc-db/$(revision cmangos-tbc-db)/Full_DB/TBCDB_1.11.0_Vengeance_One_A_Cmangos_Story.sql.gz"
          python3 .module-cache/prepared-core/modules/mod-era-talents/tools/generate-trainer-eras.py --check \
            --core-world .module-cache/prepared-core/data/sql/base/db_world \
            --classic-db "$dumps/classic-db.sql.gz" --tbc-db "$dumps/tbc-db.sql.gz" \
            --spell-dbc ".module-cache/client-locales/$LOCALE_REVISION/deDE/Spell.enUS.dbc"

      - name: Verify world buff spell contracts in the packaged client
        run: |
          curl --fail --location --retry 3 --output output/SpellDuration.dbc "$LOCALE_RAW_URL/dbc/SpellDuration.dbc"
          python3 cmake/tests/TestWorldBuffEvents.py --era-client "output/EraTalents-client-${PACKAGE_VERSION}.zip" --duration-dbc output/SpellDuration.dbc \
            --spell-dbc ".module-cache/client-locales/$LOCALE_REVISION/deDE/Spell.enUS.dbc" --mpq-reader .module-cache/mpqread

      - name: Verify historical class quest spells in the packaged client
        run: |
          python3 cmake/tests/TestHistoricalClassQuests.py --base-dbc ".module-cache/client-locales/$LOCALE_REVISION/deDE/Spell.enUS.dbc" --era-client "output/EraTalents-client-${PACKAGE_VERSION}.zip" \
            --mpq-reader .module-cache/mpqread

      - name: Upload verified historical client ZIP
        uses: actions/upload-artifact@v7
        with:
          name: era-client-zip
          path: output/EraTalents-client-*.zip
          if-no-files-found: error
          compression-level: 0
