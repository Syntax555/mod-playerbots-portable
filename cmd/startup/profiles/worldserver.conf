[worldserver]

# Core expansion access is required for the restored Vanilla Naxxramas map.
# Every character earns its own Vanilla, TBC and Wrath unlocks. Account hooks
# gate expansion races/classes for humans and the patched bot factory/login.
Expansion = 2
MaxPlayerLevel = 80
CharacterCreating.Disabled.RaceMask = 0
CharacterCreating.Disabled.ClassMask = 0

# Fresh characters start at level 1 with earned gold and normal rates.
StartPlayerLevel = 1
StartHeroicPlayerLevel = 55
StartPlayerMoney = 0

# Normal earned talent points: 51 at level 60. The trees still use Wrath data.
# Keep dual specialization out of earlier progression with a level-80 minimum.
Rate.Talent = 1
Rate.Talent.Pet = 1
MinDualSpecLevel = 80
NoResetTalentsCost = 0

# Skills and professions must be trained and improved through ordinary play.
AlwaysMaxSkillForLevel = 0
AlwaysMaxWeaponSkill = 0
MaxPrimaryTradeSkill = 2

# Admin characters also log in as ordinary, visible players so progression
# gates apply until GM mode is explicitly enabled for administration.
GM.LoginState = 0
GM.Visible = 1

# Keep useful bot diagnostics without per-action debug output for 2,500 bots.
# Send file/console writes to the existing logging worker instead of the map tick.
Logger.playerbots = 4,Console Playerbots
Log.Async.Enable = 1

# Required by Individual Progression for its Vanilla item changes and state.
EnablePlayerSettings = 1
DBC.EnforceItemAttributes = 0

# Vanilla has no Dungeon Finder. Form a party and travel to the entrance.
DungeonFinder.OptionsMask = 0

Rate.XP.Kill = 1
Rate.XP.Quest = 1
Rate.XP.Explore = 1
Rate.XP.Pet = 1
Rate.Drop.Item.Poor = 1
Rate.Drop.Item.Normal = 1
Rate.Drop.Item.Uncommon = 1
Rate.Drop.Item.Rare = 1
Rate.Drop.Item.Epic = 1
Rate.Drop.Item.Legendary = 1
Rate.Drop.Item.Artifact = 1
Rate.Drop.Item.Referenced = 1
Rate.Drop.Money = 1
Rate.Drop.Item.ReferencedAmount = 1
Rate.Drop.Item.GroupAmount = 1
Rate.Reputation.Gain = 1
Rate.Honor = 1

# Native fallback rules; strict earned-era matches select their own rules.
# AB: 2000 points for Vanilla/TBC, 1600 for Wrath. Eye: 2000 for TBC, 1600
# for Wrath. AV: no reinforcements in Vanilla, 600 in TBC/Wrath. Warsong's
# native time limit is used only in Wrath; Vanilla has no assault debuffs.
# Match rules stay fixed through refills and relogs.
# Ordinary team-size requirements apply in every era.
# Normal core invitation transport and spirit-guide waves remain available.
Battleground.Arathi.CapturePoints = 1600
Battleground.Alterac.Reinforcements = 600
Battleground.Override.LowLevels.MinPlayers = 0
Battleground.Override.LowLevels.MinPlayers.WS = 0
Battleground.Override.LowLevels.MinPlayers.AB = 0
Battleground.Override.LowLevels.MinPlayers.AV = 0
Battleground.GiveXPForKills = 0

# Use startup.exe --set-expansion individual for earned Vanilla/TBC/Wrath gates,
# or --set-expansion tbc / --set-expansion wotlk for an optional shared ceiling.
# These commands update linked world/module settings together with backups.
# Characters still earn their own progression; TBC races unlock at stage 8
# and Death Knights at 13.
