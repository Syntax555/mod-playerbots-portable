[worldserver]

# Core expansion access is required for the restored Vanilla Naxxramas map.
# Individual Progression limits gameplay to Vanilla tiers; the level cap and
# creation masks also apply to random bots, whose factory skips account hooks.
Expansion = 2
MaxPlayerLevel = 60
CharacterCreating.Disabled.RaceMask = 1536
CharacterCreating.Disabled.ClassMask = 32

# Fresh characters start at level 1 with earned gold and normal rates.
StartPlayerLevel = 1
StartHeroicPlayerLevel = 55
StartPlayerMoney = 0

# Required by Individual Progression for its Vanilla item changes and state.
EnablePlayerSettings = 1
DBC.EnforceItemAttributes = 0

# Vanilla has no Dungeon Finder. Form a party and travel to the entrance.
DungeonFinder.OptionsMask = 0

Rate.XP.Kill = 1
Rate.XP.Quest = 1
Rate.XP.Explore = 1
Rate.XP.Pet = 1
Rate.Drop.Item.Poor = 1
Rate.Drop.Item.Normal = 1
Rate.Drop.Item.Uncommon = 1
Rate.Drop.Item.Rare = 1
Rate.Drop.Item.Epic = 1
Rate.Drop.Item.Legendary = 1
Rate.Drop.Item.Artifact = 1
Rate.Drop.Item.Referenced = 1
Rate.Drop.Money = 1
Rate.Drop.Item.ReferencedAmount = 1
Rate.Drop.Item.GroupAmount = 1
Rate.Reputation.Gain = 1
Rate.Honor = 1

# To open later expansions manually, change MaxPlayerLevel to 80 and both
# creation masks to 0, then set IndividualProgression.ProgressionLimit to 0
# in its config. Characters still earn each progression tier; Individual
# Progression unlocks TBC races at stage 8 and Death Knights at stage 13.
