[worldserver]

# Real bot parties walk to supported entrances and use native combat and loot.
# Natural progression refuses route shortcuts and unsupported instance maps.
DungeonClear.Enable = 1
DungeonClear.AutonomousParties.Enable = 1
# Maximum simultaneous autonomous groups; supported range 1..8.
DungeonClear.AutonomousParties.MaxConcurrent = 2

# Do not create/gear queue fillers, relocate stuck bots, clear unreachable
# enemies' threat, or allow the free-fly camera. PostCombatRez normally uses
# a surviving party member's resurrection spell; it remains off in this profile.
DungeonClear.DungeonQueueFill.Enable = 0
DungeonClear.BgQueueFill.Enable = 0
DungeonClear.StrandedRecovery = 0
DungeonClear.PostCombatRez = 0
DungeonClear.UnreachableCombatPurgeSecs = 0
DungeonClear.SpectateEnable = 0

# Retain real corpse loot rather than a quality shortcut.
DungeonClear.LootMinQuality = 0
