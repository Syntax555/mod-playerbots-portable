Playerbots.DisabledWithoutRealPlayerLoginDelay = 30
Playerbots.DisabledWithoutRealPlayerLogoutDelay = 60
Playerbots.EnablePeriodicOnlineOffline = 0
Playerbots.RandomBotSaveInterval = 0

# Full activity on a healthy server; reduce remote activity as tick time rises.
# Combat, dungeons and bots near/grouped with real players remain active.
# This limits CPU load, but 2500 loaded characters still require substantial RAM.
Playerbots.BotActiveAlone = 100
Playerbots.botActiveAloneSmartScale = 1
Playerbots.botActiveAloneSmartScaleDiffLimitfloor = 50
Playerbots.botActiveAloneSmartScaleDiffLimitCeiling = 200
Playerbots.botActiveAloneSmartScaleWhenMinLevel = 1
Playerbots.botActiveAloneSmartScaleWhenMaxLevel = 80

# Implemented by the Playerbots fork pinned in versions.lock.json.
# Keeps ordinary character-creation starter items. Prevents factory gear/gold,
# consumables, free spells, quest completion and periodic free resurrection.
# Natural questing, looting, paid vendors/trainers and normal XP remain enabled.
# Upstream AI cannot guarantee completing every quest/profession/crafting loop.
# Teleport recovery is disabled, so bots can stall where pathfinding fails.
Playerbots.NaturalProgression = 1
Playerbots.DisableRandomLevels = 1
Playerbots.RandombotStartingLevel = 1
Playerbots.RandomBotMinLevel = 1
Playerbots.RandomBotMaxLevel = 80
Playerbots.RandomBotFixedLevel = 0
Playerbots.RandomBotXPRate = 1.0
Playerbots.SyncLevelWithPlayers = 0
Playerbots.DowngradeMaxLevelBot = 0
Playerbots.LevelBrackets.Enabled = 0
Playerbots.ResetBotLevel.Enabled = 0
# Reserve roughly 35% for earned level caps; the remaining 65% keep progressing.
# Bots start at 1 and farm normally before stopping. No level or gear grants.
# Stable GUID assignment; existing bots already above a cap are left alone.
# Customize level:percentage pairs (total <=100), or use "" to release all caps.
Playerbots.EarnedLevelBrackets = "19:5,29:5,39:5,49:5,59:5,69:5,79:5"
# Hero classes start above level 1; keep them out of the earned bot population.
Playerbots.DisableDeathKnightLogin = 1
Playerbots.EquipAndSpecPersistence = 1
Playerbots.EquipAndSpecPersistenceLevel = 1
Playerbots.AutoUpgradeEquip = 0
Playerbots.AutoEquipUpgradeLoot = 1
# Need appropriate equipment upgrades; greed other items the AI can use or sell.
# Ordinary group roll masks and native loot eligibility still apply.
