name: Publish Latest

on:
  workflow_run:
    workflows: ['Build portable ZIP']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download verified server and addon packages
        uses: actions/download-artifact@v7
        with:
          name: portable-zip
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download verified client package
        uses: actions/download-artifact@v7
        with:
          name: era-client-zip
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/publish_latest.py
          --sha '${{ github.event.workflow_run.head_sha }}'
          --artifacts output
          --notes .github/RELEASE_TEMPLATE.md
          --run-id '${{ github.run_id }}'
