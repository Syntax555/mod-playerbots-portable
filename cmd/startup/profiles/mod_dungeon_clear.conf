[worldserver]

# The module is included for optional use. Its upstream scripted routes still
# teleport across some navigation gaps, so strict earned play keeps it off.
# Set Enable = 1 to opt into autonomous tank-led dungeon runs with that limit.
DungeonClear.Enable = 0

# Do not create/gear queue fillers, relocate stuck bots, grant free wipe
# recovery, clear unreachable enemies' threat, or allow the free-fly camera.
DungeonClear.DungeonQueueFill.Enable = 0
DungeonClear.BgQueueFill.Enable = 0
DungeonClear.StrandedRecovery = 0
DungeonClear.PostCombatRez = 0
DungeonClear.UnreachableCombatPurgeSecs = 0
DungeonClear.SpectateEnable = 0

# If enabled later, retain real corpse loot rather than a quality shortcut.
DungeonClear.LootMinQuality = 0
