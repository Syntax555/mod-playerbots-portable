# Fresh individual progression world: target 2500 online bots while a real player
# session is connected. Login is gradual; bots log out after the last session.
AiPlayerbot.Enabled = 1
AiPlayerbot.RandomBotAutologin = 1
AiPlayerbot.MinRandomBots = 2500
AiPlayerbot.MaxRandomBots = 2500
AiPlayerbot.RandomBotAccountCount = 0
AiPlayerbot.AddClassAccountPoolSize = 0
AiPlayerbot.AddClassCommand = 0
AiPlayerbot.DisabledWithoutRealPlayer = 1
AiPlayerbot.DisabledWithoutRealPlayerLoginDelay = 30
AiPlayerbot.DisabledWithoutRealPlayerLogoutDelay = 60
AiPlayerbot.EnablePeriodicOnlineOffline = 0

# Full activity on a healthy server; reduce remote activity as tick time rises.
# Combat, dungeons and bots near/grouped with real players remain active.
# This limits CPU load, but 2500 loaded characters still require substantial RAM.
AiPlayerbot.BotActiveAlone = 100
AiPlayerbot.botActiveAloneSmartScale = 1
AiPlayerbot.botActiveAloneSmartScaleDiffLimitfloor = 50
AiPlayerbot.botActiveAloneSmartScaleDiffLimitCeiling = 200
AiPlayerbot.botActiveAloneSmartScaleWhenMinLevel = 1
AiPlayerbot.botActiveAloneSmartScaleWhenMaxLevel = 80

# Implemented by patches/mod-playerbots-natural-progression.patch.
# Keeps ordinary character-creation starter items. Prevents factory gear/gold,
# consumables, free spells, quest completion and periodic free resurrection.
# Natural questing, looting, paid vendors/trainers and normal XP remain enabled.
# Upstream AI cannot guarantee completing every quest/profession/crafting loop.
# Teleport recovery is disabled, so bots can stall where pathfinding fails.
AiPlayerbot.NaturalProgression = 1
AiPlayerbot.DisableRandomLevels = 1
AiPlayerbot.RandombotStartingLevel = 1
AiPlayerbot.RandomBotMinLevel = 1
AiPlayerbot.RandomBotMaxLevel = 80
AiPlayerbot.RandomBotFixedLevel = 0
AiPlayerbot.RandomBotXPRate = 1.0
AiPlayerbot.SyncLevelWithPlayers = 0
AiPlayerbot.DowngradeMaxLevelBot = 0
AiPlayerbot.LevelBrackets.Enabled = 0
AiPlayerbot.ResetBotLevel.Enabled = 0
# Reserve roughly 35% for earned level caps; the remaining 65% keep progressing.
# Bots start at 1 and farm normally before stopping. No level or gear grants.
# Stable GUID assignment; existing bots already above a cap are left alone.
# Customize level:percentage pairs (total <=100), or use "" to release all caps.
AiPlayerbot.EarnedLevelBrackets = "19:5,29:5,39:5,49:5,59:5,69:5,79:5"
# Hero classes start above level 1; keep them out of the earned bot population.
AiPlayerbot.DisableDeathKnightLogin = 1
AiPlayerbot.EquipAndSpecPersistence = 1
AiPlayerbot.EquipAndSpecPersistenceLevel = 1
AiPlayerbot.AutoUpgradeEquip = 0
AiPlayerbot.AutoEquipUpgradeLoot = 1
AiPlayerbot.AutoLearnQuestSpells = 0
AiPlayerbot.AutoLearnTrainerSpells = 0
AiPlayerbot.AllowLearnTrainerSpells = 1
AiPlayerbot.AutoPickTalents = 1
# This limits bot talent-template depth; it does not replace Wrath talent data.
AiPlayerbot.LimitTalentsExpansion = 1
AiPlayerbot.AutoDoQuests = 1
AiPlayerbot.EnableNewRpgStrategy = 1
AiPlayerbot.ApplyInstanceStrategies = 1
AiPlayerbot.AutoAvoidAoe = 1
AiPlayerbot.PreQuests = 0
AiPlayerbot.RandomBotQuestIds = ""
AiPlayerbot.AttunementQuests = ""
AiPlayerbot.RandomBotSpellIds = ""
AiPlayerbot.SyncQuestWithPlayer = 0
AiPlayerbot.SyncQuestForPlayer = 0
AiPlayerbot.BotCheats = ""
AiPlayerbot.MaintenanceCommand = 0
AiPlayerbot.AutoGearCommand = 0
AiPlayerbot.AutoGearCommandAltBots = 0
AiPlayerbot.AutoGearBisCommand = 0
AiPlayerbot.MinEnchantingBotLevel = 81

# Autonomous random bots trade real bag surplus and spend only their own gold.
# Implemented by patches/mod-playerbots-earned-auctions.patch; requires natural
# progression and no player master. Bots walk to an auctioneer/mailbox and use
# normal core auction/mail handlers, including deposits, cuts and delivery.
AiPlayerbot.EarnedAuctions = 1
# Seconds between trading visits; clamped to 60..3600.
AiPlayerbot.EarnedAuctionInterval = 300
AiPlayerbot.AutoTeleportForLevel = 0
AiPlayerbot.SummonWhenGroup = 0
AiPlayerbot.BotRepairWhenSummon = 0
AiPlayerbot.ReviveBotWhenSummoned = 0
AiPlayerbot.SummonAtInnkeepersEnabled = 0
# Individual Progression still validates each character's travel unlocks.
AiPlayerbot.RandomBotMaps = 0,1,530,571
AiPlayerbot.RandomBotJoinLfg = 0

# Match Individual Progression's paid riding trainer and mount requirements.
AiPlayerbot.UseGroundMountAtMinLevel = 40
AiPlayerbot.UseFastGroundMountAtMinLevel = 60
AiPlayerbot.UseFlyMountAtMinLevel = 70

# Natural mode blocks upstream shortcut mail commands in source, even if this
# old setting is re-enabled. Earned receipts use normal mailbox collection.
AiPlayerbot.BotSendMailEnabled = 0

