name: Build portable ZIP

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

jobs:
  launcher:
    name: Check launcher before server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test portable launcher logic and Windows compilation
        run: |
          if [[ -f cmd/startup/platform_windows.go ]]; then
            go test ./...
            go vet ./...
          fi
          GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/startup.test.exe" ./cmd/startup
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Test distribution assembly and ZIP validation
        if: hashFiles('cmake/tests/TestPortableZip.ps1') != ''
        shell: pwsh
        run: ./cmake/tests/TestPortableZip.ps1

      - name: Test rolling release publication
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test dependency license packaging
        shell: pwsh
        run: ./cmake/tests/TestDependencyLicenses.ps1

      - name: Test historical client packaging
        if: hashFiles('cmake/tests/TestEraClientPackaging.py') != ''
        run: python3 cmake/tests/TestEraClientPackaging.py

      - name: Test client language merging and gameplay preservation
        run: python3 cmake/tests/TestClientLocales.py

      - name: Check earned bot progression against pinned sources
        if: hashFiles('cmake/tests/TestEarnedProgression.py') != ''
        run: |
          git submodule update --init --depth=1 azerothcore-wotlk mod-playerbots
          cmake -P cmake/PrepareModules.cmake
          python3 cmake/tests/TestEarnedProgression.py

  era_client:
    name: Build and verify historical client patch
    needs: launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      enabled: ${{ steps.features.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check selected source client packaging capabilities
        id: features
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          paths = [pathlib.Path(p) for p in ('cmake/PackageEraClient.cmake', 'cmake/PackageEraClient.py', 'cmake/era-client-tools/CMakeLists.txt')]
          if any(p.is_file() for p in paths) and not all(p.is_file() for p in paths):
              raise SystemExit('Incomplete historical client packaging tools')
          lock = json.loads(pathlib.Path('versions.lock.json').read_text())
          enabled = all(p.is_file() for p in paths) and bool(lock.get('clientPatch'))
          publish = os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_EVENT_NAME'] in ('push', 'workflow_dispatch')
          version = 'latest' if publish else 'dev-' + os.environ['GITHUB_RUN_NUMBER']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('enabled=' + str(enabled).lower() + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('PACKAGE_VERSION=' + version + '\n')
          PYTHON

      - name: Install native client patch tools
        if: steps.features.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake p7zip-full python3-venv lua5.1
          python3 -m venv "$RUNNER_TEMP/era-client-python"
          "$RUNNER_TEMP/era-client-python/bin/python" -m pip install 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/era-client-python/bin" >> "$GITHUB_PATH"

      - name: Prepare locked server and addon sources
        if: steps.features.outputs.enabled == 'true'
        run: |
          git submodule update --init --depth=1 azerothcore-wotlk mod-playerbots
          cmake -P cmake/PrepareModules.cmake

      - name: Test historical German text and addon behavior
        if: steps.features.outputs.enabled == 'true'
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          lock = json.loads((root / 'versions.lock.json').read_text())
          core = root / '.module-cache/prepared-core' if lock['core'].get('patches') else root / lock['core']['source']
          module = core / 'modules/mod-era-talents'
          subprocess.run([sys.executable, str(module / 'tools/test_era_locales.py')], cwd=module, check=True)
          for fixture in sorted((module / 'client-addon/EraTalents').glob('test_*.lua')):
              subprocess.run(['lua5.1', str(fixture)], cwd=module, check=True)
          PYTHON

      - name: Build merged IP and historical talent client ZIP
        if: steps.features.outputs.enabled == 'true'
        run: cmake "-DPACKAGE_VERSION=$PACKAGE_VERSION" -P cmake/PackageEraClient.cmake

      - name: Upload verified historical client ZIP
        if: steps.features.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: era-client-zip
          path: output/EraTalents-client-*.zip
          if-no-files-found: error
          compression-level: 0

  build:
    name: Build and verify Windows ZIP
    needs: launcher
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # ExternalProject starts another cmake --build, which needs its own limit.
      CMAKE_BUILD_PARALLEL_LEVEL: '2'

    steps:
      - name: Determine package name
        id: version
        shell: pwsh
        run: |
          $publish = $env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -in @('push', 'workflow_dispatch')
          $version = if ($publish) { 'latest' } else { "dev-$env:GITHUB_RUN_NUMBER" }
          "value=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PACKAGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout pinned submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Check packaging capabilities of selected source
        id: package_features
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('versions.lock.json', 'CMakeLists.txt', 'cmake/VerifyPortableZip.ps1')) {
              if (-not (Test-Path $path -PathType Leaf)) { throw "Selected source cannot build a portable ZIP: missing $path" }
          }
          $hasPackager = Test-Path 'cmake/PackageClientAddons.cmake' -PathType Leaf
          $hasVerifier = Test-Path 'cmake/VerifyClientAddonZip.ps1' -PathType Leaf
          if ($hasPackager -ne $hasVerifier) { throw 'Selected source has an incomplete standalone addon packaging implementation.' }
          $hasArchiveTarget = Select-String -Path 'CMakeLists.txt' -Pattern 'add_custom_target\(package_zip_archive' -Quiet
          $hasResourcePreflight = Select-String -Path 'CMakeLists.txt' -Pattern 'ExternalProject_Add_StepTargets\(azerothcore\s+configure\)' -Quiet
          "standalone_addons=$($hasPackager.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "archive_only=$($hasArchiveTarget.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "resource_preflight=$($hasResourcePreflight.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test startup launcher
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed.' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher vet failed.' }

      - name: Install Boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.84.0
          toolset: msvc
          link: static
          platform_version: 2022

      - name: Cache MySQL and OpenSSL
        uses: actions/cache@v6
        with:
          path: |
            C:\tools\mysql\current
            C:\tools\openssl\current
          key: win-deps-mysql-8.0.40-openssl-3.5.7

      - name: Setup build and bundled runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $boostRoot = '${{ steps.install-boost.outputs.BOOST_ROOT }}'
          "BOOST_ROOT_DIR=$boostRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path 'C:\tools\mysql\current\bin\mysqld.exe')) {
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql-8.0.40-winx64.zip'
              curl.exe --fail -sSL --retry 3 'https://cdn.mysql.com/archives/mysql-8.0/mysql-8.0.40-winx64.zip' -o $mysqlZip
              if ($LASTEXITCODE -ne 0) { throw 'MySQL download failed.' }
              New-Item -ItemType Directory -Force 'C:\tools\mysql' | Out-Null
              Expand-Archive $mysqlZip 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item 'C:\tools\mysql\current' -Recurse -Force }
              Move-Item 'C:\tools\mysql\mysql-8.0.40-winx64' 'C:\tools\mysql\current'
              Get-ChildItem 'C:\tools\mysql\current' -Recurse -Filter '*.pdb' | Remove-Item -Force
          }
          'MYSQL_ROOT_DIR=C:\tools\mysql\current' | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path 'C:\tools\openssl\current\x64\include\openssl\opensslv.h')) {
              $opensslZip = Join-Path $env:RUNNER_TEMP 'openssl-3.5.7.zip'
              curl.exe --fail -sSL --retry 3 'https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.5.7.zip' -o $opensslZip
              if ($LASTEXITCODE -ne 0) { throw 'OpenSSL download failed.' }
              New-Item -ItemType Directory -Force 'C:\tools\openssl\current' | Out-Null
              Expand-Archive $opensslZip 'C:\tools\openssl\current' -Force
          }
          'OPENSSL_ROOT_DIR=C:\tools\openssl\current\x64' | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure pinned server and all modules
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake -B build -S . -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPACKAGE_VERSION='${{ steps.version.outputs.value }}' `
            -DMYSQL_ROOT_DIR="$env:MYSQL_ROOT_DIR" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DBOOST_ROOT_DIR="$env:BOOST_ROOT_DIR" 2>&1 | Tee-Object -Variable configureLog
          $configureExitCode = $LASTEXITCODE
          if ($configureExitCode -ne 0) {
              $message = ($configureLog | Select-Object -Last 30) -join "`n"
              if ($message.Length -gt 8000) { $message = $message.Substring($message.Length - 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=CMake configure failed::$message"
              exit $configureExitCode
          }

      - name: Preserve dependency licenses
        shell: pwsh
        run: ./scripts/CopyDependencyLicenses.ps1 -DistDir dist

      - name: Check Windows resources before C++ compilation
        if: steps.package_features.outputs.resource_preflight == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --target azerothcore-configure --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native server configuration failed.' }
          $nativeBuild = Join-Path (Get-Location) 'build/azerothcore-build'
          if (Select-String -Path (Join-Path $nativeBuild 'CMakeCache.txt') -Pattern '^ACORE_MSVC_COMPILE_JOBS:STRING=' -Quiet) {
              foreach ($relativeProject in @('modules/modules.vcxproj', 'src/server/game/game.vcxproj')) {
                  [xml]$projectXml = Get-Content (Join-Path $nativeBuild $relativeProject) -Raw
                  $limits = @($projectXml.SelectNodes('//*[local-name()="ClCompile"]/*[local-name()="ProcessorNumber"]'))
                  if ($limits.Count -eq 0 -or @($limits | Where-Object { $_.InnerText -ne '2' }).Count -ne 0) {
                      throw "Native compiler process limit was not applied: $relativeProject"
                  }
              }
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild -PathType Leaf)) { throw 'MSBuild was not found.' }
          foreach ($application in @('authserver', 'worldserver')) {
              $project = Join-Path $nativeBuild "src/server/apps/$application.vcxproj"
              & $msbuild $project '/t:PrepareForBuild;ResourceCompile' '/p:Configuration=Release' '/p:Platform=x64' '/p:BuildProjectReferences=false' '/m:1' '/nologo'
              if ($LASTEXITCODE -ne 0) { throw "Windows resource compilation failed: $application" }
          }

      - name: Compile and assemble complete distribution
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # A manual run may check out an older tag without this matcher file.
          $hasMatchers = Test-Path '.github/problem-matchers/msvc.json'
          if ($hasMatchers) { Write-Output '::add-matcher::.github/problem-matchers/msvc.json' }
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -Variable buildLog
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0 -and @($buildLog | Where-Object { "$_" -match '\berror C1060\b' }).Count -gt 0) {
              # Keep successful objects and retry the memory failure with one native project.
              Write-Output 'Compiler memory exhaustion: retrying with one parallel project.'
              $env:CMAKE_BUILD_PARALLEL_LEVEL = '1'
              cmake --build build --config Release --parallel 1 2>&1 | Tee-Object -Variable buildLog
              $buildExitCode = $LASTEXITCODE
          }
          if ($hasMatchers) {
              Write-Output '::remove-matcher owner=portable-msvc-errors::'
              Write-Output '::remove-matcher owner=portable-linker-errors::'
          }
          if ($buildExitCode -ne 0) {
              # Other projects can keep building after the first compiler error.
              # Prefer the original diagnostics over the final ExternalProject wrapper.
              $errors = @($buildLog | Where-Object {
                  "$_" -match '(?i)(:\s*(?:fatal\s+)?error\b|\bCMake Error\b|^\s*error:)'
              } | Select-Object -Unique)
              $primaryErrors = @($errors | Where-Object { "$_" -notmatch '\berror MSB8066\b' })
              if ($primaryErrors.Count -gt 0) { $errors = $primaryErrors }
              if ($errors.Count -gt 0) {
                  $message = ($errors | Select-Object -First 20) -join "`n"
                  if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              } else {
                  $message = ($buildLog | Select-Object -Last 30) -join "`n"
                  if ($message.Length -gt 8000) { $message = $message.Substring($message.Length - 8000) }
              }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=CMake build failed::$message"
              exit $buildExitCode
          }

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              ./scripts/CopyWindowsRuntime.ps1 -DistDir dist
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Bundle Visual C++ runtime::$message"
              exit 1
          }

      - name: Smoke test bundled server and database executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
              # Restrict search to the Windows system and bundled application DLLs.
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              Push-Location dist
              try {
                  foreach ($exe in @('authserver.exe', 'worldserver.exe', 'mysql/bin/mysql.exe', 'mysql/bin/mysqld.exe', 'mysql/bin/mysqladmin.exe')) {
                      & "./$exe" --version
                      if ($LASTEXITCODE -ne 0) { throw "Bundled runtime smoke test failed: $exe (exit code $LASTEXITCODE)." }
                  }
              } finally {
                  Pop-Location
              }
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Smoke test bundled server and database executables::$message"
              exit 1
          }
          exit 0

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
              $zipTarget = if ('${{ steps.package_features.outputs.archive_only }}' -eq 'true') { 'package_zip_archive' } else { 'package_zip' }
              cmake --build build --target $zipTarget --config Release 2>&1 | Tee-Object -Variable packageLog
              $packageExitCode = $LASTEXITCODE
              if ($packageExitCode -ne 0) {
                  $details = ($packageLog | Select-Object -Last 30) -join "`n"
                  throw "ZIP packaging failed (exit code $packageExitCode).`n$details"
              }
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Create portable ZIP::$message"
              exit 1
          }

      - name: Create standalone client addon ZIPs
        if: steps.package_features.outputs.standalone_addons == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
              cmake "-DPACKAGE_VERSION=$env:PACKAGE_VERSION" -P cmake/PackageClientAddons.cmake 2>&1 | Tee-Object -Variable addonPackageLog
              $packageExitCode = $LASTEXITCODE
              if ($packageExitCode -ne 0) {
                  $details = ($addonPackageLog | Select-Object -Last 30) -join "`n"
                  throw "Client addon ZIP packaging failed (exit code $packageExitCode).`n$details"
              }
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Create standalone client addon ZIPs::$message"
              exit 1
          }

      - name: Verify server ZIP contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              ./cmake/VerifyPortableZip.ps1 -ZipPath 'output/mod-playerbots-portable-${{ steps.version.outputs.value }}.zip' -ExpectedRevision '${{ github.sha }}'
              $hash = (Get-FileHash 'output/mod-playerbots-portable-${{ steps.version.outputs.value }}.zip' -Algorithm SHA256).Hash.ToLower()
              Write-Host "SHA-256: $hash"
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Verify server ZIP contents::$message"
              exit 1
          }

      - name: Verify standalone client addon ZIP contents
        if: steps.package_features.outputs.standalone_addons == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              $lock = Get-Content 'versions.lock.json' -Raw | ConvertFrom-Json
              foreach ($addon in @($lock.clientAddons)) {
                  $archiveName = if ($null -ne $addon.archiveName) { $addon.archiveName } else { $addon.name }
                  $zipPath = "output/$archiveName-$env:PACKAGE_VERSION.zip"
                  ./cmake/VerifyClientAddonZip.ps1 -ZipPath $zipPath -AddonName $addon.name
                  $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
                  Write-Host "SHA-256 ($zipPath): $hash"
              }
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Verify standalone client addon ZIP contents::$message"
              exit 1
          }

      - name: Upload compiled ZIP for review
        uses: actions/upload-artifact@v7
        with:
          name: portable-zip
          path: output/*.zip
          if-no-files-found: error
          compression-level: 0
