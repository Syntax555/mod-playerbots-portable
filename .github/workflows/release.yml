name: Build portable ZIP

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to build and publish; leave empty for a build artifact only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

jobs:
  launcher:
    name: Check launcher before server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test portable launcher logic and Windows compilation
        run: |
          if [[ -f cmd/startup/platform_windows.go ]]; then
            go test ./...
            go vet ./...
          fi
          GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/startup.test.exe" ./cmd/startup
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Test distribution assembly and ZIP validation
        if: hashFiles('cmake/tests/TestPortableZip.ps1') != ''
        shell: pwsh
        run: ./cmake/tests/TestPortableZip.ps1

  build:
    name: Build and verify Windows ZIP
    needs: launcher
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Determine package version and source tag
        id: version
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          $releaseTag = ''
          $checkoutRef = ''
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/v*') {
              $releaseTag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              $releaseTag = $env:REQUESTED_RELEASE_TAG
          }
          if ($releaseTag) {
              if ($releaseTag -cnotmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*\z') { throw 'Invalid release tag. Select an existing v* tag.' }
              $version = $releaseTag.Substring(1)
              $checkoutRef = "refs/tags/$releaseTag"
          } else {
              $version = "dev-$env:GITHUB_RUN_NUMBER"
          }
          "value=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checkout_ref=$checkoutRef" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PACKAGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout pinned submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.checkout_ref }}
          submodules: recursive

      - name: Check packaging capabilities of selected source
        id: package_features
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('versions.lock.json', 'CMakeLists.txt', 'cmake/VerifyPortableZip.ps1')) {
              if (-not (Test-Path $path -PathType Leaf)) { throw "Selected source cannot build a portable ZIP: missing $path" }
          }
          $hasPackager = Test-Path 'cmake/PackageClientAddons.cmake' -PathType Leaf
          $hasVerifier = Test-Path 'cmake/VerifyClientAddonZip.ps1' -PathType Leaf
          if ($hasPackager -ne $hasVerifier) { throw 'Selected source has an incomplete standalone addon packaging implementation.' }
          $hasArchiveTarget = Select-String -Path 'CMakeLists.txt' -Pattern 'add_custom_target\(package_zip_archive' -Quiet
          "standalone_addons=$($hasPackager.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "archive_only=$($hasArchiveTarget.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test startup launcher
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed.' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher vet failed.' }

      - name: Install Boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.84.0
          toolset: msvc
          link: static
          platform_version: 2022

      - name: Cache MySQL and OpenSSL
        uses: actions/cache@v6
        with:
          path: |
            C:\tools\mysql\current
            C:\tools\openssl\current
          key: win-deps-mysql-8.0.40-openssl-3.5.7

      - name: Setup build and bundled runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $boostRoot = '${{ steps.install-boost.outputs.BOOST_ROOT }}'
          "BOOST_ROOT_DIR=$boostRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path 'C:\tools\mysql\current\bin\mysqld.exe')) {
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql-8.0.40-winx64.zip'
              curl.exe --fail -sSL --retry 3 'https://cdn.mysql.com/archives/mysql-8.0/mysql-8.0.40-winx64.zip' -o $mysqlZip
              if ($LASTEXITCODE -ne 0) { throw 'MySQL download failed.' }
              New-Item -ItemType Directory -Force 'C:\tools\mysql' | Out-Null
              Expand-Archive $mysqlZip 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item 'C:\tools\mysql\current' -Recurse -Force }
              Move-Item 'C:\tools\mysql\mysql-8.0.40-winx64' 'C:\tools\mysql\current'
              Get-ChildItem 'C:\tools\mysql\current' -Recurse -Filter '*.pdb' | Remove-Item -Force
          }
          'MYSQL_ROOT_DIR=C:\tools\mysql\current' | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path 'C:\tools\openssl\current\x64\include\openssl\opensslv.h')) {
              $opensslZip = Join-Path $env:RUNNER_TEMP 'openssl-3.5.7.zip'
              curl.exe --fail -sSL --retry 3 'https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.5.7.zip' -o $opensslZip
              if ($LASTEXITCODE -ne 0) { throw 'OpenSSL download failed.' }
              New-Item -ItemType Directory -Force 'C:\tools\openssl\current' | Out-Null
              Expand-Archive $opensslZip 'C:\tools\openssl\current' -Force
          }
          'OPENSSL_ROOT_DIR=C:\tools\openssl\current\x64' | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure pinned server and all modules
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake -B build -S . -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPACKAGE_VERSION='${{ steps.version.outputs.value }}' `
            -DMYSQL_ROOT_DIR="$env:MYSQL_ROOT_DIR" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DBOOST_ROOT_DIR="$env:BOOST_ROOT_DIR" 2>&1 | Tee-Object -Variable configureLog
          $configureExitCode = $LASTEXITCODE
          if ($configureExitCode -ne 0) {
              $message = ($configureLog | Select-Object -Last 30) -join "`n"
              if ($message.Length -gt 8000) { $message = $message.Substring($message.Length - 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=CMake configure failed::$message"
              exit $configureExitCode
          }

      - name: Compile and assemble complete distribution
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # A manual run may check out an older tag without this matcher file.
          $hasMatchers = Test-Path '.github/problem-matchers/msvc.json'
          if ($hasMatchers) { Write-Output '::add-matcher::.github/problem-matchers/msvc.json' }
          cmake --build build --config Release --parallel 4 2>&1 | Tee-Object -Variable buildLog
          $buildExitCode = $LASTEXITCODE
          if ($hasMatchers) {
              Write-Output '::remove-matcher owner=portable-msvc-errors::'
              Write-Output '::remove-matcher owner=portable-linker-errors::'
          }
          if ($buildExitCode -ne 0) {
              # Other projects can keep building after the first compiler error.
              # Prefer the original diagnostics over the final ExternalProject wrapper.
              $errors = @($buildLog | Where-Object {
                  "$_" -match '(?i)(:\s*(?:fatal\s+)?error\b|\bCMake Error\b|^\s*error:)'
              } | Select-Object -Unique)
              $primaryErrors = @($errors | Where-Object { "$_" -notmatch '\berror MSB8066\b' })
              if ($primaryErrors.Count -gt 0) { $errors = $primaryErrors }
              if ($errors.Count -gt 0) {
                  $message = ($errors | Select-Object -First 20) -join "`n"
                  if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              } else {
                  $message = ($buildLog | Select-Object -Last 30) -join "`n"
                  if ($message.Length -gt 8000) { $message = $message.Substring($message.Length - 8000) }
              }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=CMake build failed::$message"
              exit $buildExitCode
          }

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              ./scripts/CopyWindowsRuntime.ps1 -DistDir dist
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Bundle Visual C++ runtime::$message"
              exit 1
          }

      - name: Smoke test bundled server and database executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
              # Restrict search to the Windows system and bundled application DLLs.
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              Push-Location dist
              try {
                  foreach ($exe in @('authserver.exe', 'worldserver.exe', 'mysql/bin/mysql.exe', 'mysql/bin/mysqld.exe', 'mysql/bin/mysqladmin.exe')) {
                      & "./$exe" --version
                      if ($LASTEXITCODE -ne 0) { throw "Bundled runtime smoke test failed: $exe (exit code $LASTEXITCODE)." }
                  }
                  & './dbimport.exe' --help
                  if ($LASTEXITCODE -ne 0) { throw "Bundled database import tool failed to load (exit code $LASTEXITCODE)." }
                  $usage = & './vmap4_assembler.exe' unused unused unused
                  if ($LASTEXITCODE -ne 1 -or ($usage -join "`n") -notmatch 'usage:') {
                      throw "Bundled map assembler failed to load (exit code $LASTEXITCODE; expected usage output and exit code 1)."
                  }
              } finally {
                  Pop-Location
              }
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Smoke test bundled server and database executables::$message"
              exit 1
          }
          # The assembler usage check intentionally returns 1. GitHub's pwsh
          # wrapper otherwise forwards that last native exit code after success.
          exit 0

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
              $zipTarget = if ('${{ steps.package_features.outputs.archive_only }}' -eq 'true') { 'package_zip_archive' } else { 'package_zip' }
              cmake --build build --target $zipTarget --config Release 2>&1 | Tee-Object -Variable packageLog
              $packageExitCode = $LASTEXITCODE
              if ($packageExitCode -ne 0) {
                  $details = ($packageLog | Select-Object -Last 30) -join "`n"
                  throw "ZIP packaging failed (exit code $packageExitCode).`n$details"
              }
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Create portable ZIP::$message"
              exit 1
          }

      - name: Create standalone client addon ZIPs
        if: steps.package_features.outputs.standalone_addons == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
              cmake "-DPACKAGE_VERSION=$env:PACKAGE_VERSION" -P cmake/PackageClientAddons.cmake 2>&1 | Tee-Object -Variable addonPackageLog
              $packageExitCode = $LASTEXITCODE
              if ($packageExitCode -ne 0) {
                  $details = ($addonPackageLog | Select-Object -Last 30) -join "`n"
                  throw "Client addon ZIP packaging failed (exit code $packageExitCode).`n$details"
              }
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Create standalone client addon ZIPs::$message"
              exit 1
          }

      - name: Verify server ZIP contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              ./cmake/VerifyPortableZip.ps1 -ZipPath 'output/mod-playerbots-portable-${{ steps.version.outputs.value }}.zip'
              $hash = (Get-FileHash 'output/mod-playerbots-portable-${{ steps.version.outputs.value }}.zip' -Algorithm SHA256).Hash.ToLower()
              Write-Host "SHA-256: $hash"
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Verify server ZIP contents::$message"
              exit 1
          }

      - name: Verify standalone client addon ZIP contents
        if: steps.package_features.outputs.standalone_addons == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              $lock = Get-Content 'versions.lock.json' -Raw | ConvertFrom-Json
              foreach ($addon in @($lock.clientAddons)) {
                  $archiveName = if ($null -ne $addon.archiveName) { $addon.archiveName } else { $addon.name }
                  $zipPath = "output/$archiveName-$env:PACKAGE_VERSION.zip"
                  ./cmake/VerifyClientAddonZip.ps1 -ZipPath $zipPath -AddonName $addon.name
                  $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
                  Write-Host "SHA-256 ($zipPath): $hash"
              }
          } catch {
              $message = $_.Exception.Message
              if ($message.Length -gt 8000) { $message = $message.Substring(0, 8000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Verify standalone client addon ZIP contents::$message"
              exit 1
          }

      - name: Generate release notes with locked versions
        shell: pwsh
        run: |
          $lock = Get-Content 'versions.lock.json' -Raw | ConvertFrom-Json
          $version = '${{ steps.version.outputs.value }}'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('Prebuilt Windows x64 AzerothCore server with the pinned modules and client addons listed below.')
          $lines.Add('')
          $lines.Add('Download and extract mod-playerbots-portable-' + $version + '.zip, then run startup.exe. Required client data and databases are downloaded/initialized on first launch. No compiler is required.')
          $lines.Add('')
          $lines.Add('Fresh installations use Vanilla progression, a level-60 cap and a target of 2,500 level-1 bots. Gradual bot login begins 30 seconds after a real player connects; bots log out about 60 seconds after the last real session disconnects. Natural maintenance uses normal NPC prices and prerequisites. See README.md and defaults/ in the ZIP for behavior and AI limits.')
          $lines.Add('')
          $lines.Add('Bots fill real players'' Warsong Gulch (levels 10–60), Arathi Basin (20–60) and Alterac Valley (51–60) queues with their earned levels and equipment. Autonomous all-bot matches, random/later battlegrounds and arenas stay disabled. Ghosts use normal spirit-guide resurrection waves. Nearby greetings target real players only; random emotes and toxic-link/Thunderfury meme replies stay off.')
          $lines.Add('')
          $lines.Add('Audited profiles keep normal earned talent/skill rates, paid trainer respecs, two primary professions and riding at levels 40/60. New dual-spec purchases are unavailable below level 80. Shortcut bot mail and unsolicited event broadcasts are disabled. AutoBalance counts actual party members, including bots, with explicit dungeon/raid minimums and no player-count offset.')
          $lines.Add('')
          $lines.Add('Quest Loot Party is now included and enabled. Eligible party members can individually loot their own copy of naturally dropped normal-quality quest items from the corpse; drop chances and ordinary equipment loot rules stay unchanged. Login announcements are off. Forced drops, automatic item delivery and broad personal-loot features are not included.')
          $lines.Add('')
          if ($lock.modules | Where-Object { $_.name -eq 'mod-token-turnin' }) {
              $lines.Add('Token Turn-in permits only read-only token inventory/mapping checks (.check). The .redeem command is blocked because it bypasses AQ/Naxx scarab, reputation and material requirements.')
              $lines.Add('')
          }
          $lines.Add('This remains Vanilla content progression on the Wrath client/core: talent trees and some class systems are not original 1.12 rules. See the included docs/vanilla-config-audit.md for limitations and module coverage. Existing spellbooks are preserved.')
          $lines.Add('')
          $lines.Add('For an existing installation, stop the servers and run startup.exe --apply-profiles once to apply the recommended settings with config backups. Existing characters and databases are preserved.')
          $lines.Add('')
          if (Test-Path 'cmd/startup/expansion.go' -PathType Leaf) {
              $lines.Add('To open TBC or WotLK later, stop the realm and run startup.exe --set-expansion tbc or startup.exe --set-expansion wotlk, then restart normally. Linked configs change together with backups; the selected phase survives --apply-profiles. Every character still earns its own progression. See docs/changing-expansions.md.')
              $lines.Add('')
          }
          $lines.Add('### Locked upstream versions')
          $lines.Add('')
          foreach ($dependency in @($lock.core) + @($lock.modules)) {
              $repo = $dependency.url -replace '\.git$', ''
              $lines.Add('- **' + $dependency.name + '**: [' + $dependency.revision.Substring(0, 12) + '](' + $repo + '/commit/' + $dependency.revision + ')')
          }
          $lines.Add('')
          $lines.Add('### Included client addons')
          $lines.Add('')
          foreach ($addon in @($lock.clientAddons)) {
              $repo = $addon.url -replace '\.git$', ''
              $archiveName = if ($null -ne $addon.archiveName) { $addon.archiveName } else { $addon.name }
              $install = 'Copy addons/' + $addon.name + ' from the server ZIP into your client Interface/AddOns/ folder.'
              if ('${{ steps.package_features.outputs.standalone_addons }}' -eq 'true') {
                  $install = 'Download the standalone ' + $archiveName + '-' + $version + '.zip and copy its ' + $addon.name + '/ folder into your client Interface/AddOns/ folder, or use addons/' + $addon.name + ' from the server ZIP.'
              }
              $lines.Add('- **' + $archiveName + '**: [' + $addon.revision.Substring(0, 12) + '](' + $repo + '/commit/' + $addon.revision + ') for WoW 3.3.5a. ' + $install + ' The installed folder must be named ' + $addon.name + '.')
          }
          $lines.Add('')
          if ($lock.clientAddons | Where-Object { $_.url -like '*/MultiBot-Chatless.git' }) {
              $lines.Add('Remove the old MultiBot folder from Interface/AddOns/ before replacing it with MultiBot-Chatless. Install the replacement as Interface/AddOns/MultiBot/ so MultiBot.toc loads correctly.')
          }
          $lines.Add('')
          $patchNotes = [System.Collections.Generic.List[string]]::new()
          foreach ($dependency in $lock.modules) {
              foreach ($patch in @($dependency.patches)) {
                  if ($patch) { $patchNotes.Add('- **' + $dependency.name + '**: `' + $patch + '`') }
              }
          }
          if ($patchNotes.Count -gt 0) {
              $lines.Add('### Included source patches')
              $lines.Add('')
              $lines.AddRange($patchNotes)
              $lines.Add('')
              $lines.Add('Upstream revisions remain pinned. See README.md for patch behavior and limits.')
          }
          [System.IO.File]::WriteAllText('release_notes.md', ($lines -join "`n"), [System.Text.UTF8Encoding]::new($false))

      - name: Upload compiled ZIP for review
        uses: actions/upload-artifact@v7
        with:
          name: portable-zip
          path: output/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload release notes
        if: steps.version.outputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  release:
    name: Publish tagged ZIP release
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified ZIP
        uses: actions/download-artifact@v7
        with:
          name: portable-zip
          path: output

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes

      - name: Publish ZIP release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_tag }}
          body_path: release_notes.md
          prerelease: false
          draft: false
          files: output/*.zip
          fail_on_unmatched_files: true
