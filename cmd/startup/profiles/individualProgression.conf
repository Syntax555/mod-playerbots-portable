[worldserver]

# Every character begins at the first Vanilla tier. Stage 7 is completed
# Vanilla Naxxramas; stage 8 opens TBC. A limit of 0 allows all later tiers.
IndividualProgression.Enable = 1
IndividualProgression.StartingProgression = 0
IndividualProgression.ProgressionLimit = 0
IndividualProgression.DisableDefaultProgression = 0
IndividualProgression.CustomProgression = ""

# Each normal character earns every required milestone in order. Boss credit
# requires presence at the defeated boss; no skipped tiers, leader copying,
# account exemptions or group attunement-item grants in this mode.
IndividualProgression.StrictEarnedProgression = 1

# Apply the same progression gates to random bots and human characters.
# The upstream default excludes RNDBOT accounts and grants class quest spells.
IndividualProgression.BotAccountsRegex = ""
IndividualProgression.ExcludedAccountsRegex = ""
IndividualProgression.BotAccountsMaxLevel = 80

# Use the same output policy for humans and bots; avoid stacking an unmeasured
# global damage/healing reduction on top of AutoBalance's party-size scaling.
IndividualProgression.VanillaPowerAdjustment = 1.0
IndividualProgression.VanillaHealingAdjustment = 1.0
IndividualProgression.TBCPowerAdjustment = 1.0
IndividualProgression.TBCHealingAdjustment = 1.0
IndividualProgression.BotOnlyAdjustments = 0

# Permit recruiting companions at different earned tiers. Each character still
# has to meet their own content, quest and item progression requirements.
IndividualProgression.EnforceGroupRules = 0
IndividualProgression.EnableAllSpellRanks = 0

IndividualProgression.TbcRacesUnlockProgression = 8
IndividualProgression.tbcRacesStartingProgression = 0
IndividualProgression.DeathKnightUnlockProgression = 13
IndividualProgression.DeathKnightStartingProgression = 13

# Use the module's progression mechanics and keep the Dungeon Finder disabled.
IndividualProgression.SimpleConfigOverride = 1
IndividualProgression.DisableRDF = 0
IndividualProgression.DisableQuestMarkers = 1
IndividualProgression.QuestXPFix = 1
IndividualProgression.AllowEarlyDungeonSet2 = 0
IndividualProgression.AllowEarlyScourgeBosses = 0
IndividualProgression.EnableSetRepCommand = 0

# Individual mode needs no realm switch: each character earns expansion access.
# Optional vanilla/tbc modes add a realm ceiling. The saved mode survives updates.
# Each character still earns stages 8 = TBC, 13 = Wrath, 18 = completed Wrath.
