name: Hold v1.0.16 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/hold-v1.0.16.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  stop_release:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the superseded v1.0.16 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37611841963" --jq .status)
          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/37611841963/cancel"
          fi
