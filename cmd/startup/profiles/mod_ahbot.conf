[worldserver]

# The module is compiled in, but it cannot farm: its seller creates items and
# its buyer supplies artificial demand. Keep both off for an earned economy.
# Playerbots' separate earned-auction loop trades its actual inventory and gold;
# configure that in playerbots.conf, not through this synthetic AH module.
AuctionHouseBot.EnableSeller = false
AuctionHouseBot.Buyer.Enabled = false
AuctionHouseBot.GUIDs = 0
