[worldserver]

# Scale instance difficulty to the party size, keeping original creature
# levels and progression requirements. Normal parties still earn their loot.
AutoBalance.Enable.Global = 1
AutoBalance.LevelScaling = 0

# Count the actual non-GM party, including playerbots, with no difficulty offset.
# Full groups retain normal stats; smaller groups use the upstream scaling curve.
AutoBalance.MinPlayers = 1
AutoBalance.MinPlayers.Heroic = 1
AutoBalance.MinPlayers.Raid = 1
AutoBalance.MinPlayers.RaidHeroic = 1
AutoBalance.playerCountDifficultyOffset = 0

# No extra expansion tokens or increased experience/gold rewards.
AutoBalance.reward.enable = 0
AutoBalance.RewardScaling.Method = "dynamic"
AutoBalance.RewardScaling.XP = 1
AutoBalance.RewardScaling.XP.Modifier = 1.0
AutoBalance.RewardScaling.Money = 1
AutoBalance.RewardScaling.Money.Modifier = 1.0
