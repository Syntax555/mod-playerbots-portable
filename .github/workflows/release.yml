name: Build portable ZIP

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.github/RELEASE_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.github/RELEASE_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  # Main builds queue: a running build always finishes, and a newer push
  # replaces any waiting run so the newest commit builds next. Other refs
  # cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  launcher:
    name: Check launcher before server build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Determine package version
        id: version
        run: |
          # Only main builds that can be published carry the rolling name.
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" =~ ^(push|workflow_dispatch)$ ]]; then
            echo 'value=latest' >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test portable launcher logic and Windows compilation
        run: |
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/startup.test.exe" ./cmd/startup
          GOOS=windows GOARCH=amd64 go vet ./...
          GOBIN="$RUNNER_TEMP/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$RUNNER_TEMP/bin/staticcheck" ./...
          GOOS=windows GOARCH=amd64 "$RUNNER_TEMP/bin/staticcheck" ./...

      - name: Check that every fixture runs in CI
        run: python3 cmake/tests/run_fixtures.py check

      - name: Lint packaging, release and fixture scripts
        run: pipx run --spec ruff==0.16.8 ruff check cmake scripts

      - name: Test distribution assembly and ZIP validation
        shell: pwsh
        run: ./cmake/tests/TestPortableZip.ps1

      - name: Test release publication and build annotation scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test dependency license packaging
        shell: pwsh
        run: ./cmake/tests/TestDependencyLicenses.ps1

      - name: Test historical client packaging
        run: python3 cmake/tests/TestEraClientPackaging.py

      - name: Test patched client addon packaging
        run: python3 cmake/tests/TestClientAddonPatches.py

      - name: Test client language merging and gameplay preservation
        run: python3 cmake/tests/TestClientLocales.py

      - name: Install native gameplay test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake lua5.1 python3-venv
          python3 -m venv "$RUNNER_TEMP/gameplay-python"
          "$RUNNER_TEMP/gameplay-python/bin/python" -m pip install 'PyYAML==6.0.3'
          "$RUNNER_TEMP/gameplay-python/bin/python" -c 'import yaml; assert yaml.__version__ == "6.0.3"'
          lua5.1 -e 'assert(_VERSION == "Lua 5.1")'
          echo "$RUNNER_TEMP/gameplay-python/bin" >> "$GITHUB_PATH"

      - name: Check gameplay rules against pinned sources
        run: |
          git submodule update --init --depth=1 azerothcore-wotlk mod-playerbots
          cmake -P cmake/PrepareModules.cmake
          python3 cmake/tests/run_fixtures.py gameplay

  era_client:
    name: Build and verify historical client patch
    needs: launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.launcher.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Read the locked client locale source
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_ENV"
          import json
          source = json.load(open('versions.lock.json'))['clientPatch']['localizations']['deDE']
          repository = source['url'].removeprefix('https://github.com/').removesuffix('.git')
          print(f"LOCALE_REVISION={source['revision']}")
          print(f"LOCALE_RAW_URL=https://raw.githubusercontent.com/{repository}/{source['revision']}")
          PYTHON

      - name: Install native client patch tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake p7zip-full python3-venv lua5.1
          python3 -m venv "$RUNNER_TEMP/era-client-python"
          "$RUNNER_TEMP/era-client-python/bin/python" -m pip install 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/era-client-python/bin" >> "$GITHUB_PATH"

      - name: Prepare locked server and addon sources
        run: |
          git submodule update --init --depth=1 azerothcore-wotlk mod-playerbots
          cmake -P cmake/PrepareModules.cmake

      - name: Test historical German text and addon behavior
        run: |
          cd .module-cache/prepared-core/modules/mod-era-talents
          python3 tools/test_era_locales.py
          # A missing fixture leaves the pattern unexpanded, so lua5.1 fails.
          for fixture in client-addon/EraTalents/test_*.lua; do lua5.1 "$fixture"; done

      - name: Test MultiBot inventory money display
        run: python3 cmake/tests/TestMultiBotInventoryMoney.py

      - name: Test MultiBot options initialization
        run: python3 cmake/tests/TestMultiBotOptions.py

      - name: Build merged IP and historical talent client ZIP
        run: cmake "-DPACKAGE_VERSION=$PACKAGE_VERSION" -P cmake/PackageEraClient.cmake

      - name: Test historical spell groups against native stacking rules
        run: python3 cmake/tests/TestEraSpellGroups.py

      - name: Verify world buff spell contracts in the packaged client
        run: |
          curl --fail --location --output output/SpellDuration.dbc "$LOCALE_RAW_URL/dbc/SpellDuration.dbc"
          python3 cmake/tests/TestWorldBuffEvents.py --era-client "output/EraTalents-client-${PACKAGE_VERSION}.zip" --duration-dbc output/SpellDuration.dbc \
            --spell-dbc ".module-cache/client-locales/$LOCALE_REVISION/deDE/Spell.enUS.dbc" --mpq-reader .module-cache/mpqread

      - name: Verify historical class quest spells in the packaged client
        run: |
          python3 cmake/tests/TestHistoricalClassQuests.py --base-dbc ".module-cache/client-locales/$LOCALE_REVISION/deDE/Spell.enUS.dbc" --era-client "output/EraTalents-client-${PACKAGE_VERSION}.zip" \
            --mpq-reader .module-cache/mpqread

      - name: Upload verified historical client ZIP
        uses: actions/upload-artifact@v7
        with:
          name: era-client-zip
          path: output/EraTalents-client-*.zip
          if-no-files-found: error
          compression-level: 0

  build:
    name: Build and verify Windows ZIP
    needs: launcher
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      PACKAGE_VERSION: ${{ needs.launcher.outputs.package_version }}
      # ExternalProject starts another cmake --build, which needs its own limit.
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      # MSBuild supplies /MP2 without changing the core's native /MP option.
      CL_MPCount: '2'
      # Bundled runtime dependencies. Change a version together with the
      # SHA-256 of its exact download.
      MYSQL_VERSION: '8.0.40'
      MYSQL_ZIP_SHA256: '7c3f1c09ba1b4a82df32a8d889533fceaf2692383e386a04ee708a12de66f129'
      OPENSSL_VERSION: '3.5.7'
      OPENSSL_ZIP_SHA256: '2591459a06a6df2d2e2b23b02a28d7c180b95c02fb4965099a708b7365a74014'
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout pinned submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test startup launcher
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed.' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher vet failed.' }

      - name: Install Boost
        # Third-party action pinned by commit; Dependabot proposes updates.
        uses: MarkusJx/install-boost@f9d34f6fe427b8f2ae424d7bf2a3ebccb0dae5a3 # v2.6.0
        id: install-boost
        with:
          boost_version: 1.84.0
          toolset: msvc
          link: static
          platform_version: 2022

      - name: Cache MySQL and OpenSSL
        uses: actions/cache@v6
        with:
          path: |
            C:\tools\mysql\current
            C:\tools\openssl\current
          key: win-deps-mysql-${{ env.MYSQL_VERSION }}-${{ env.MYSQL_ZIP_SHA256 }}-openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_ZIP_SHA256 }}

      - name: Setup build and bundled runtime dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $boostRoot = '${{ steps.install-boost.outputs.BOOST_ROOT }}'
          "BOOST_ROOT_DIR=$boostRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # Shipped binaries come only from archives that match the pinned hash.
          function Save-VerifiedArchive([string]$Name, [string]$Url, [string]$Sha256) {
              $path = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetFileName($Url))
              curl.exe --fail -sSL --retry 3 $Url -o $path
              if ($LASTEXITCODE -ne 0) { throw "$Name download failed." }
              $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              if ($actual -ne $Sha256) { throw "$Name download has SHA-256 $actual; expected $Sha256." }
              return $path
          }

          if (-not (Test-Path 'C:\tools\mysql\current\bin\mysqld.exe')) {
              $mysqlName = "mysql-$env:MYSQL_VERSION-winx64"
              $mysqlSeries = $env:MYSQL_VERSION -replace '^(\d+[.]\d+)[.].*$', '$1'
              $mysqlZip = Save-VerifiedArchive 'MySQL' "https://cdn.mysql.com/archives/mysql-$mysqlSeries/$mysqlName.zip" $env:MYSQL_ZIP_SHA256
              New-Item -ItemType Directory -Force 'C:\tools\mysql' | Out-Null
              Expand-Archive $mysqlZip 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item 'C:\tools\mysql\current' -Recurse -Force }
              Move-Item "C:\tools\mysql\$mysqlName" 'C:\tools\mysql\current'
              Get-ChildItem 'C:\tools\mysql\current' -Recurse -Filter '*.pdb' | Remove-Item -Force
          }
          'MYSQL_ROOT_DIR=C:\tools\mysql\current' | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path 'C:\tools\openssl\current\x64\include\openssl\opensslv.h')) {
              $opensslZip = Save-VerifiedArchive 'OpenSSL' "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-$env:OPENSSL_VERSION.zip" $env:OPENSSL_ZIP_SHA256
              New-Item -ItemType Directory -Force 'C:\tools\openssl\current' | Out-Null
              Expand-Archive $opensslZip 'C:\tools\openssl\current' -Force
          }
          'OPENSSL_ROOT_DIR=C:\tools\openssl\current\x64' | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure pinned server and all modules
        run: |
          . ./scripts/WriteActionsError.ps1
          $PSNativeCommandUseErrorActionPreference = $false
          cmake -B build -S . -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPACKAGE_VERSION="$env:PACKAGE_VERSION" `
            -DMYSQL_ROOT_DIR="$env:MYSQL_ROOT_DIR" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DBOOST_ROOT_DIR="$env:BOOST_ROOT_DIR" 2>&1 | Tee-Object -Variable configureLog
          $configureExitCode = $LASTEXITCODE
          if ($configureExitCode -ne 0) {
              Write-ActionsError -Title 'CMake configure failed' -Message (($configureLog | Select-Object -Last 30) -join "`n") -Tail
              exit $configureExitCode
          }

      - name: Preserve dependency licenses
        run: ./scripts/CopyDependencyLicenses.ps1 -DistDir dist -OpenSSLVersion $env:OPENSSL_VERSION

      - name: Check Windows resources before C++ compilation
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --target azerothcore-configure --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native server configuration failed.' }
          $nativeBuild = Join-Path (Get-Location) 'build/azerothcore-build'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild -PathType Leaf)) { throw 'MSBuild was not found.' }
          foreach ($application in @('authserver', 'worldserver')) {
              $project = Join-Path $nativeBuild "src/server/apps/$application.vcxproj"
              & $msbuild $project '/t:PrepareForBuild;ResourceCompile' '/p:Configuration=Release' '/p:Platform=x64' '/p:BuildProjectReferences=false' '/m:1' '/nologo'
              if ($LASTEXITCODE -ne 0) { throw "Windows resource compilation failed: $application" }
          }

      - name: Compile and assemble complete distribution
        run: |
          . ./scripts/WriteActionsError.ps1
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Output '::add-matcher::.github/problem-matchers/msvc.json'
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -Variable buildLog
          $buildExitCode = $LASTEXITCODE
          # cl.exe reports C1060; MSBuild's CL task can also run out of memory itself.
          $memoryFailure = '\berror C1060\b|\bSystem[.]OutOfMemoryException\b'
          if ($buildExitCode -ne 0 -and @($buildLog | Where-Object { "$_" -match $memoryFailure }).Count -gt 0) {
              # Keep successful objects and retry the memory failure with one native project.
              Write-Output 'Compiler memory exhaustion: retrying with one parallel project.'
              $env:CMAKE_BUILD_PARALLEL_LEVEL = '1'
              cmake --build build --config Release --parallel 1 2>&1 | Tee-Object -Variable buildLog
              $buildExitCode = $LASTEXITCODE
          }
          Write-Output '::remove-matcher owner=portable-msvc-errors::'
          Write-Output '::remove-matcher owner=portable-linker-errors::'
          if ($buildExitCode -ne 0) {
              # Other projects can keep building after the first compiler error.
              # Prefer the original diagnostics over the final ExternalProject wrapper.
              $errors = @($buildLog | Where-Object {
                  "$_" -match '(?i)(:\s*(?:fatal\s+)?error\b|\bCMake Error\b|^\s*error:)'
              } | Select-Object -Unique)
              $primaryErrors = @($errors | Where-Object { "$_" -notmatch '\berror MSB8066\b' })
              if ($primaryErrors.Count -gt 0) { $errors = $primaryErrors }
              if ($errors.Count -gt 0) {
                  Write-ActionsError -Title 'CMake build failed' -Message (($errors | Select-Object -First 20) -join "`n")
              } else {
                  Write-ActionsError -Title 'CMake build failed' -Message (($buildLog | Select-Object -Last 30) -join "`n") -Tail
              }
              exit $buildExitCode
          }

      - name: Bundle Visual C++ runtime
        run: |
          . ./scripts/WriteActionsError.ps1
          $ErrorActionPreference = 'Stop'
          Invoke-ActionsStep 'Bundle Visual C++ runtime' { ./scripts/CopyWindowsRuntime.ps1 -DistDir dist }

      - name: Smoke test bundled server and database executables
        run: |
          . ./scripts/WriteActionsError.ps1
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Invoke-ActionsStep 'Smoke test bundled server and database executables' {
              # Restrict search to the Windows system and bundled application DLLs.
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              Push-Location dist
              try {
                  foreach ($exe in @('authserver.exe', 'worldserver.exe', 'mysql/bin/mysql.exe', 'mysql/bin/mysqld.exe', 'mysql/bin/mysqladmin.exe')) {
                      & "./$exe" --version
                      if ($LASTEXITCODE -ne 0) { throw "Bundled runtime smoke test failed: $exe (exit code $LASTEXITCODE)." }
                  }
              } finally {
                  Pop-Location
              }
          }
          exit 0

      - name: Create portable ZIP
        run: |
          . ./scripts/WriteActionsError.ps1
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Invoke-ActionsStep 'Create portable ZIP' {
              cmake --build build --target package_zip_archive --config Release 2>&1 | Tee-Object -Variable packageLog
              $packageExitCode = $LASTEXITCODE
              if ($packageExitCode -ne 0) {
                  $details = ($packageLog | Select-Object -Last 30) -join "`n"
                  throw "ZIP packaging failed (exit code $packageExitCode).`n$details"
              }
          }

      - name: Create standalone client addon ZIPs
        run: |
          . ./scripts/WriteActionsError.ps1
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Invoke-ActionsStep 'Create standalone client addon ZIPs' {
              cmake "-DPACKAGE_VERSION=$env:PACKAGE_VERSION" -P cmake/PackageClientAddons.cmake 2>&1 | Tee-Object -Variable addonPackageLog
              $packageExitCode = $LASTEXITCODE
              if ($packageExitCode -ne 0) {
                  $details = ($addonPackageLog | Select-Object -Last 30) -join "`n"
                  throw "Client addon ZIP packaging failed (exit code $packageExitCode).`n$details"
              }
          }

      - name: Verify server ZIP contents
        run: |
          . ./scripts/WriteActionsError.ps1
          $ErrorActionPreference = 'Stop'
          Invoke-ActionsStep 'Verify server ZIP contents' {
              $zipPath = "output/mod-playerbots-portable-$env:PACKAGE_VERSION.zip"
              ./cmake/VerifyPortableZip.ps1 -ZipPath $zipPath -ExpectedRevision '${{ github.sha }}'
              $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
              Write-Host "SHA-256: $hash"
          }

      - name: Verify standalone client addon ZIP contents
        run: |
          . ./scripts/WriteActionsError.ps1
          $ErrorActionPreference = 'Stop'
          Invoke-ActionsStep 'Verify standalone client addon ZIP contents' {
              $lock = Get-Content 'versions.lock.json' -Raw | ConvertFrom-Json
              foreach ($addon in @($lock.clientAddons)) {
                  $archiveName = if ($null -ne $addon.archiveName) { $addon.archiveName } else { $addon.name }
                  $zipPath = "output/$archiveName-$env:PACKAGE_VERSION.zip"
                  ./cmake/VerifyClientAddonZip.ps1 -ZipPath $zipPath -AddonName $addon.name
                  $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
                  Write-Host "SHA-256 ($zipPath): $hash"
              }
          }

      - name: Upload compiled ZIP for review
        uses: actions/upload-artifact@v7
        with:
          name: portable-zip
          path: output/*.zip
          if-no-files-found: error
          compression-level: 0
